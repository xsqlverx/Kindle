name: Assistant phone preview

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Create temporary preview signing key
        run: |
          keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname 'CN=Kindle Assistant Preview' -keyalg RSA -keysize 2048 -validity 10000
          chmod 600 debug.keystore
      - name: Build side-by-side preview
        run: gradle --no-daemon :app:assembleAssistantPreview
      - name: Check assistant routing
        run: gradle --no-daemon :app:testAssistantPreviewUnitTest --tests 'com.example.AssistantRoutingTest'
      - uses: actions/upload-artifact@v4
        with:
          name: kindle-assistant-preview
          path: app/build/outputs/apk/assistantPreview/*.apk
          if-no-files-found: error
          retention-days: 7
